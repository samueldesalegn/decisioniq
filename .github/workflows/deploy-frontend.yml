name: Deploy DecisionIQ Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Deploy Angular build to S3
        run: |
          aws s3 sync dist/frontend/browser s3://decisioniq-frontend-samuel --delete

      - name: Set content type and cache for JavaScript
        run: |
          aws s3 cp \
            s3://decisioniq-frontend-samuel \
            s3://decisioniq-frontend-samuel \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --metadata-directive REPLACE \
            --content-type "application/javascript" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Set content type and cache for CSS
        run: |
          aws s3 cp \
            s3://decisioniq-frontend-samuel \
            s3://decisioniq-frontend-samuel \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --content-type "text/css" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Set content type and cache for JSON
        run: |
          aws s3 cp \
            s3://decisioniq-frontend-samuel \
            s3://decisioniq-frontend-samuel \
            --recursive \
            --exclude "*" \
            --include "*.json" \
            --metadata-directive REPLACE \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Set content type for favicon
        run: |
          aws s3 cp \
            s3://decisioniq-frontend-samuel/favicon.ico \
            s3://decisioniq-frontend-samuel/favicon.ico \
            --metadata-directive REPLACE \
            --content-type "image/x-icon" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Disable cache for index.html
        run: |
          aws s3 cp \
            s3://decisioniq-frontend-samuel/index.html \
            s3://decisioniq-frontend-samuel/index.html \
            --metadata-directive REPLACE \
            --cache-control "no-cache,no-store,must-revalidate,max-age=0" \
            --content-type "text/html"