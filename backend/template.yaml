AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DecisionIQ backend API

Parameters:
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key (sk_test_... or sk_live_...)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: 'pending'
    Description: Stripe webhook signing secret (whsec_...)
  StripePriceId:
    Type: String
    Description: Stripe price ID for the Pro plan (price_...)

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'https://decisioniq.sdcloudhub.com'"
    Auth:
      DefaultAuthorizer: DecisionIQCognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        DecisionIQCognitoAuthorizer:
          UserPoolArn: !GetAtt DecisionIQUserPool.Arn

Resources:

  DecisionIQUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: DecisionIQUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  DecisionIQUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: DecisionIQWebClient
      UserPoolId: !Ref DecisionIQUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - https://decisioniq.sdcloudhub.com
              - http://localhost:4200
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  ResultBucket:
    Type: AWS::S3::Bucket

  AnalysisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DecisionIQAnalysis
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysisId
          AttributeType: S
        - AttributeName: fileHash
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: analysisId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: FileHashIndex
          KeySchema:
            - AttributeName: fileHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DecisionIQUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: stripeCustomerId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StripeCustomerIndex
          KeySchema:
            - AttributeName: stripeCustomerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambdaHandler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/upload.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          ANALYSIS_TABLE: !Ref AnalysisTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        UploadApi:
          Type: Api
          Properties:
            Path: /upload-url
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/upload.ts

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/analyze.handler
      Timeout: 60
      Environment:
        Variables:
          ANALYSIS_TABLE: !Ref AnalysisTable
          RESULT_BUCKET: !Ref ResultBucket
          USERS_TABLE: !Ref UsersTable
          BEDROCK_REGION: us-east-1
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - S3WritePolicy:
            BucketName: !Ref ResultBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            Path: /analyze
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/analyze.ts

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/chat.handler
      Timeout: 60
      Environment:
        Variables:
          ANALYSIS_TABLE: !Ref AnalysisTable
          BEDROCK_REGION: us-east-1
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
        - S3ReadPolicy:
            BucketName: !Ref ResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        ChatApi:
          Type: Api
          Properties:
            Path: /chat
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/chat.ts

  GetAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/get-analysis.handler
      Environment:
        Variables:
          ANALYSIS_TABLE: !Ref AnalysisTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
        - S3ReadPolicy:
            BucketName: !Ref ResultBucket
      Events:
        GetAnalysisApi:
          Type: Api
          Properties:
            Path: /analysis/{analysisId}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/get-analysis.ts

  ListAnalysesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/list-analyses.handler
      Environment:
        Variables:
          ANALYSIS_TABLE: !Ref AnalysisTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        ListAnalysesApi:
          Type: Api
          Properties:
            Path: /analyses
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/list-analyses.ts

  BillingCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/billing-checkout.handler
      Timeout: 30
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_PRICE_ID: !Ref StripePriceId
          APP_URL: https://decisioniq.sdcloudhub.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        CheckoutApi:
          Type: Api
          Properties:
            Path: /billing/checkout
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/billing-checkout.ts

  BillingPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/billing-portal.handler
      Timeout: 30
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          APP_URL: https://decisioniq.sdcloudhub.com
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        PortalApi:
          Type: Api
          Properties:
            Path: /billing/portal
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/billing-portal.ts

  BillingStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/billing-status.handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          ANALYSIS_TABLE: !Ref AnalysisTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        StatusApi:
          Type: Api
          Properties:
            Path: /billing/status
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/billing-status.ts

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/stripe-webhook.handler
      Timeout: 30
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        WebhookApi:
          Type: Api
          Properties:
            Path: /billing/webhook
            Method: post
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - handlers/stripe-webhook.ts

Outputs:

  ApiUrl:
    Description: DecisionIQ API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  HealthEndpoint:
    Description: DecisionIQ Health endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/health"

  UploadEndpoint:
    Description: DecisionIQ Upload endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url"

  AnalyzeEndpoint:
    Description: DecisionIQ Analyze endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyze"

  ChatEndpoint:
    Description: DecisionIQ AI Chat endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/chat"

  BillingWebhookEndpoint:
    Description: DecisionIQ Stripe webhook endpoint (register this URL in Stripe)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/billing/webhook"

  GetAnalysisEndpoint:
    Description: DecisionIQ Get Analysis endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/analysis/{analysisId}"

  ListAnalysesEndpoint:
    Description: DecisionIQ List Analyses endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyses"

  UploadBucketName:
    Description: DecisionIQ Upload Bucket
    Value: !Ref UploadBucket

  ResultBucketName:
    Description: DecisionIQ Result Bucket
    Value: !Ref ResultBucket

  AnalysisTableName:
    Description: DecisionIQ Analysis Table
    Value: !Ref AnalysisTable

  UsersTableName:
    Description: DecisionIQ Users Table
    Value: !Ref UsersTable

  CognitoUserPoolId:
    Description: DecisionIQ Cognito User Pool ID
    Value: !Ref DecisionIQUserPool

  CognitoUserPoolClientId:
    Description: DecisionIQ Cognito User Pool Client ID
    Value: !Ref DecisionIQUserPoolClient

  CognitoUserPoolArn:
    Description: DecisionIQ Cognito User Pool ARN
    Value: !GetAtt DecisionIQUserPool.Arn

  HealthFunction:
    Description: DecisionIQ Health Lambda ARN
    Value: !GetAtt HealthFunction.Arn

  UploadFunction:
    Description: DecisionIQ Upload Lambda ARN
    Value: !GetAtt UploadFunction.Arn

  AnalyzeFunction:
    Description: DecisionIQ Analyze Lambda ARN
    Value: !GetAtt AnalyzeFunction.Arn

  ChatFunction:
    Description: DecisionIQ Chat Lambda ARN
    Value: !GetAtt ChatFunction.Arn

  GetAnalysisFunction:
    Description: DecisionIQ Get Analysis Lambda ARN
    Value: !GetAtt GetAnalysisFunction.Arn

  ListAnalysesFunction:
    Description: DecisionIQ List Analyses Lambda ARN
    Value: !GetAtt ListAnalysesFunction.Arn